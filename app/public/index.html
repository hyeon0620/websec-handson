<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゆるチャット（脆弱版）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ゆるチャット</h1>
    <div id="userbox">
      <span id="whoami">未ログイン</span>
      <button id="logoutBtn" hidden>ログアウト</button>
    </div>
  </header>

  <!-- ログイン画面 -->
  <section id="loginView">
    <h2>ログイン</h2>
    <form id="loginForm">
      <label>ユーザー名 <input name="username" autocomplete="off"></label>
      <label>パスワード <input name="password" type="text" autocomplete="off"></label>
      <button type="submit">ログイン</button>
    </form>
    <p class="hint">テスト用アカウント: <code>alice</code> / <code>alice123</code></p>
    <p id="loginError" class="error"></p>
  </section>

  <!-- チャット画面 -->
  <section id="chatView" hidden>
    <!-- 知らない人から届いたDM（＝CSRFの罠リンク）。課題3で「踏む」対象。 -->
    <div class="dm-spam">
      <span class="dm-from">知らない人からのDM</span>
      <a href="http://127.0.0.1:4000"> かわいい猫の画像まとめ、見てみて！</a>
    </div>

    <div id="messages"></div>

    <form id="messageForm">
      <input name="content" placeholder="メッセージを入力…" autocomplete="off">
      <button type="submit">送信</button>
    </form>

    <div class="danger-zone">
      <a id="deleteAllLink" href="/api/messages/delete-all">全メッセージ削除</a>
      <button id="resetBtn" type="button">リセット（初期状態に戻す）</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
