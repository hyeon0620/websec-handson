<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif">
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#8a9199"/></marker></defs>
<rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

<!-- ① 入力（ログイン画面） -->
<g transform="translate(60,44)">
  <rect x="0" y="0" width="420" height="150" rx="12" fill="#ffffff" stroke="#c4cad0" stroke-width="2.5"/>
  <path d="M0,12 a12,12 0 0 1 12,-12 h396 a12,12 0 0 1 12,12 v26 h-420 Z" fill="#eef2f6"/>
  <circle cx="20" cy="19" r="4.5" fill="#c4cad0"/><circle cx="36" cy="19" r="4.5" fill="#c4cad0"/><circle cx="52" cy="19" r="4.5" fill="#c4cad0"/>
  <text x="24" y="74" font-size="18" fill="#1f5c8b">ログイン画面 ・ ユーザー名</text>
  <rect x="24" y="88" width="372" height="46" rx="8" fill="#ffffff" stroke="#e2792b" stroke-width="2.5"/>
  <text x="40" y="120" font-family="'Courier New',monospace" font-size="26" font-weight="bold" fill="#e2792b">admin' --</text>
</g>
<circle cx="72" cy="56" r="17" fill="#e2792b"/><text x="72" y="63" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text>
<text x="510" y="105" font-size="20" fill="#1f2933">攻撃者がユーザー名の欄に</text>
<text x="510" y="135" font-size="20" fill="#1f2933">こう入力する</text>

<!-- 下向き矢印 -->
<line x1="270" y1="200" x2="270" y2="258" stroke="#8a9199" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="292" y="238" font-size="19" fill="#5a626b">入力をそのままSQL文に埋め込む</text>

<!-- ② 出来上がるSQL -->
<g transform="translate(60,272)">
  <rect x="0" y="0" width="880" height="158" rx="10" fill="#f4f6f8" stroke="#c4cad0" stroke-width="2"/>
  <rect x="0" y="0" width="6" height="158" rx="0" fill="#2e7db5"/>
  <text x="30" y="56" font-family="'Courier New',monospace" font-size="26" fill="#1f2933">SELECT * FROM users</text>
  <text x="30" y="100" font-family="'Courier New',monospace" font-size="26"><tspan fill="#1f2933">WHERE name = '</tspan><tspan fill="#e2792b" font-weight="bold">admin' --</tspan><tspan fill="#b0b6bd" text-decoration="line-through">' AND pw = '****'</tspan></text>
  <text x="30" y="138" font-size="19" fill="#b4600f">「 -- 」から後ろは SQL のコメント扱いになり、まるごと消える</text>
</g>
<circle cx="72" cy="284" r="17" fill="#e2792b"/><text x="72" y="291" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">2</text>

<!-- ③ 結果 -->
<rect x="60" y="450" width="880" height="54" rx="12" fill="#fbe7d5" stroke="#e2792b" stroke-width="2.5"/>
<text x="510" y="484" text-anchor="middle" font-size="23" font-weight="bold" fill="#b4600f">パスワード照合が消え、パスワードを知らなくてもログイン成功</text>
<circle cx="72" cy="477" r="17" fill="#e2792b"/><text x="72" y="484" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">3</text>
</svg>
