<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif">
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#8a9199"/></marker></defs>
<rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

<!-- ブラウザ -->
<g transform="translate(40,80)">
  <rect x="0" y="0" width="260" height="150" rx="12" fill="#ffffff" stroke="#c4cad0" stroke-width="2.5"/>
  <path d="M0,12 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v24 h-260 Z" fill="#eef2f6"/>
  <circle cx="18" cy="18" r="4.5" fill="#c4cad0"/><circle cx="34" cy="18" r="4.5" fill="#c4cad0"/>
  <rect x="22" y="54" width="150" height="14" rx="7" fill="#e6f0f8"/>
  <rect x="22" y="80" width="216" height="11" rx="5" fill="#eef2f6"/>
  <rect x="22" y="98" width="216" height="11" rx="5" fill="#eef2f6"/>
</g>
<text x="170" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2933">ブラウザ</text>

<!-- サーバー -->
<g transform="translate(445,88)">
  <rect x="0" y="0" width="120" height="135" rx="12" fill="#e6f0f8" stroke="#2e7db5" stroke-width="2.5"/>
  <rect x="16" y="16" width="88" height="22" rx="5" fill="#ffffff" stroke="#bcd6ec"/><circle cx="92" cy="27" r="4.5" fill="#2e7db5"/>
  <rect x="16" y="46" width="88" height="22" rx="5" fill="#ffffff" stroke="#bcd6ec"/><circle cx="92" cy="57" r="4.5" fill="#2e7db5"/>
  <rect x="16" y="76" width="88" height="22" rx="5" fill="#ffffff" stroke="#bcd6ec"/><circle cx="92" cy="87" r="4.5" fill="#2e7db5"/>
</g>
<text x="505" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2933">サーバー</text>

<!-- DB -->
<g transform="translate(800,92)">
  <path d="M0,18 v92 a52,17 0 0 0 104,0 v-92" fill="#edeff1" stroke="#8a9199" stroke-width="2.5"/>
  <ellipse cx="52" cy="18" rx="52" ry="17" fill="#f7f8f9" stroke="#8a9199" stroke-width="2.5"/>
  <path d="M0,55 a52,17 0 0 0 104,0" fill="none" stroke="#c4cad0" stroke-width="2"/>
</g>
<text x="852" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2933">データベース</text>

<!-- 矢印 -->
<line x1="305" y1="150" x2="440" y2="150" stroke="#8a9199" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="570" y1="150" x2="793" y2="150" stroke="#8a9199" stroke-width="3.5" marker-end="url(#ah)"/>

<!-- 攻撃タグ：XSS（ブラウザ） -->
<line x1="170" y1="60" x2="170" y2="78" stroke="#e2792b" stroke-width="2.5" stroke-dasharray="4,3"/>
<rect x="92" y="26" width="156" height="34" rx="10" fill="#fbe7d5" stroke="#e2792b" stroke-width="2"/>
<text x="170" y="49" text-anchor="middle" font-size="18" font-weight="bold" fill="#b4600f">XSS</text>

<!-- 攻撃タグ：CSRF（リクエスト） -->
<line x1="372" y1="118" x2="372" y2="148" stroke="#e2792b" stroke-width="2.5" stroke-dasharray="4,3"/>
<rect x="312" y="86" width="120" height="34" rx="10" fill="#fbe7d5" stroke="#e2792b" stroke-width="2"/>
<text x="372" y="109" text-anchor="middle" font-size="18" font-weight="bold" fill="#b4600f">CSRF</text>

<!-- 攻撃タグ：SQLi（サーバー→DB） -->
<line x1="682" y1="118" x2="682" y2="148" stroke="#e2792b" stroke-width="2.5" stroke-dasharray="4,3"/>
<rect x="586" y="86" width="192" height="34" rx="10" fill="#fbe7d5" stroke="#e2792b" stroke-width="2"/>
<text x="682" y="109" text-anchor="middle" font-size="17" font-weight="bold" fill="#b4600f">SQLインジェクション</text>

<!-- 説明 -->
<text x="170" y="292" text-anchor="middle" font-size="16" fill="#5a626b">表示するとき</text>
<text x="372" y="292" text-anchor="middle" font-size="16" fill="#5a626b">送るとき</text>
<text x="682" y="292" text-anchor="middle" font-size="16" fill="#5a626b">DBに問い合わせるとき</text>

<!-- 帯 -->
<rect x="40" y="330" width="920" height="72" rx="12" fill="#fbe7d5" stroke="#e2792b" stroke-width="2.5"/>
<text x="500" y="362" text-anchor="middle" font-size="21" font-weight="bold" fill="#b4600f">今日の3つは、この「正常な流れ」の別々の場所を破る攻撃</text>
<text x="500" y="388" text-anchor="middle" font-size="17" fill="#1f2933">＝ 入力やリクエストを、アプリが「信じすぎる」ことが原因</text>
</svg>
