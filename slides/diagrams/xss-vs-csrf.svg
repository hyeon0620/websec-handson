<rect x="150" y="44" width="168" height="42" rx="21" fill="#ffffff" stroke="#2e7db5" stroke-width="2.5"/>
<text x="234" y="74" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f5c8b">XSS</text>

<!-- Browser window -->
