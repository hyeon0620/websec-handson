<circle cx="55" cy="50" r="3.5" fill="#1f5c8b"/><circle cx="77" cy="50" r="3.5" fill="#1f5c8b"/>
<path d="M56,62 Q66,70 76,62" stroke="#1f5c8b" stroke-width="3" fill="none" stroke-linecap="round"/>
