<line x1="30" y1="6" x2="24" y2="-4" stroke="#b4600f" stroke-width="2.5"/><line x1="40" y1="6" x2="46" y2="-4" stroke="#b4600f" stroke-width="2.5"/>
<line x1="11" y1="30" x2="0" y2="24" stroke="#b4600f" stroke-width="2.5"/><line x1="11" y1="42" x2="0" y2="48" stroke="#b4600f" stroke-width="2.5"/>
<line x1="59" y1="30" x2="70" y2="24" stroke="#b4600f" stroke-width="2.5"/><line x1="59" y1="42" x2="70" y2="48" stroke="#b4600f" stroke-width="2.5"/>
<circle cx="30" cy="14" r="2.5" fill="#fff"/><circle cx="40" cy="14" r="2.5" fill="#fff"/>
</g>
</g>

<!-- victim avatar right of browser -->
<g transform="translate(348,152) scale(0.62)">
