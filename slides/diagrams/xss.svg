<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif">
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#8a9199"/></marker></defs>
<rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

<!-- ① 投稿された"ただの文字" -->
<circle cx="52" cy="70" r="17" fill="#e2792b"/><text x="52" y="77" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text>
<text x="80" y="77" font-size="21" font-weight="bold" fill="#1f2933">投稿された "ただの文字"</text>

<g transform="translate(40,95)">
  <rect x="0" y="0" width="380" height="150" rx="12" fill="#ffffff" stroke="#c4cad0" stroke-width="2.5"/>
  <text x="24" y="40" font-size="18" fill="#1f5c8b">チャットに投稿</text>
  <rect x="24" y="56" width="332" height="76" rx="10" fill="#f4f6f8" stroke="#c4cad0" stroke-width="1.5"/>
  <text x="40" y="86" font-family="'Courier New',monospace" font-size="19" fill="#e2792b" font-weight="bold">&lt;img src=x</text>
  <text x="40" y="112" font-family="'Courier New',monospace" font-size="19" fill="#e2792b" font-weight="bold">  onerror=alert('XSS')&gt;</text>
</g>
<text x="230" y="268" text-anchor="middle" font-size="17" fill="#5a626b">サーバーには文字として保存されるだけ</text>

<!-- 中央の矢印 -->
<line x1="432" y1="170" x2="548" y2="170" stroke="#8a9199" stroke-width="4" marker-end="url(#ah)"/>
<text x="490" y="150" text-anchor="middle" font-size="17" fill="#5a626b">別の人が</text>
<text x="490" y="200" text-anchor="middle" font-size="17" fill="#5a626b">ページを開くと</text>

<!-- ② 他人のブラウザでコードとして実行 -->
<circle cx="562" cy="70" r="17" fill="#e2792b"/><text x="562" y="77" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">2</text>
<text x="590" y="77" font-size="21" font-weight="bold" fill="#1f2933">他人のブラウザでコードとして実行</text>

<g transform="translate(560,95)">
  <rect x="0" y="0" width="400" height="250" rx="12" fill="#ffffff" stroke="#c4cad0" stroke-width="2.5"/>
  <path d="M0,12 a12,12 0 0 1 12,-12 h376 a12,12 0 0 1 12,12 v28 h-400 Z" fill="#eef2f6"/>
  <circle cx="20" cy="20" r="5" fill="#c4cad0"/><circle cx="38" cy="20" r="5" fill="#c4cad0"/><circle cx="56" cy="20" r="5" fill="#c4cad0"/>
  <!-- 背景のチャット行 -->
  <rect x="24" y="56" width="150" height="14" rx="7" fill="#eef2f6"/>
  <rect x="24" y="80" width="220" height="14" rx="7" fill="#eef2f6"/>
  <!-- alert ダイアログ（実行された証拠） -->
  <rect x="70" y="96" width="260" height="132" rx="10" fill="#ffffff" stroke="#8a9199" stroke-width="2.5"/>
  <rect x="70" y="96" width="260" height="34" rx="10" fill="#e6f0f8"/>
  <text x="86" y="119" font-size="16" fill="#1f5c8b">このページの内容</text>
  <!-- 警告マーク（絵文字ではなく図形） -->
  <path d="M200,140 L222,180 L178,180 Z" fill="#fbe7d5" stroke="#e2792b" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="200" y="176" text-anchor="middle" font-size="24" font-weight="bold" fill="#b4600f">!</text>
  <text x="200" y="206" text-anchor="middle" font-family="'Courier New',monospace" font-size="20" font-weight="bold" fill="#1f2933">XSS</text>
</g>
<text x="760" y="368" text-anchor="middle" font-size="17" fill="#5a626b">文字だったものが JavaScript として動く</text>

<!-- 帯 -->
<rect x="40" y="408" width="920" height="50" rx="12" fill="#fbe7d5" stroke="#e2792b" stroke-width="2.5"/>
<text x="500" y="440" text-anchor="middle" font-size="22" font-weight="bold" fill="#b4600f">同じ投稿が、閲覧した人全員のブラウザで勝手に実行される</text>
</svg>
